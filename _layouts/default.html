<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site.title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png" >
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    
    <style>
        body {
        margin: 0;
        padding: 0;
        color: white;
    }

    #site {
        position: fixed;
        inset: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: auto;
        background: transparent;
    }

    /* Livello fisso ancorato a tutti e 4 i bordi dello schermo */
    .sfondo-stelle {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-color: #000000;
        background-image: 
            radial-gradient(#ffffff 1px, transparent 1px),
            radial-gradient(#e6e6e6 1px, transparent 1px),
            radial-gradient(#cccccc 1px, transparent 1px),
            radial-gradient(#b3b3b3 1px, transparent 1px),
            radial-gradient(#999999 1px, transparent 1px),
            radial-gradient(#808080 1px, transparent 1px),
            radial-gradient(#666666 1px, transparent 1px),
            radial-gradient(#4d4d4d 1px, transparent 1px),
            radial-gradient(#333333 1px, transparent 1px),
            radial-gradient(#222222 1px, transparent 1px);
        background-size: 
            311px 311px, 257px 257px, 199px 199px, 173px 173px, 149px 149px,
            127px 127px, 107px 107px, 89px 89px, 73px 73px, 59px 59px;
        background-position: 
            15px 40px, 110px 180px, 50px 90px, 140px 20px, 80px 130px,
            30px 70px, 90px 15px, 45px 55px, 20px 35px, 10px 15px;
    }
        #content{
            flex-grow:1;
            display:flex;
            flex-direction: column;
        
        }
        #center-content{ flex-grow: 1; }  

        #center-content a:link {
        color: white; /* viola chiaro per link normali */
        }

        #center-content a:visited {
        color: white; /* viola più scuro per link visitati */
        }

        #center-content ::selection {
        color: white;        /* colore del testo selezionato */
        background:  #6152cc;    /* colore dello sfondo del testo selezionato */
        }

        ol, ul {
            color: white;
        }

        li::marker {
            color: white;
        }


    </style>
</head>
<body>
    <div class="sfondo-stelle"></div>
    <div id="site">
        <div class="sticky-top" id="header">
            {% include header.html %}  
        </div>
        <div id="content">
            <div id="center-content" class="d-flex">
                {{ content }}
            </div>
        </div>
    </div>
</body>
</html>
